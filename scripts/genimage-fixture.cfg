# Fixture stick for scripts/test_in_qemu.sh.
#
# Partitioned on purpose. A bare `mkfs.vfat` on a 64 MiB file produces a
# "superfloppy": a filesystem at offset 0 with no partition table, which the
# guest sees as /dev/sdb with no /dev/sdb1. That is a real-world layout and
# SignerOS accepts it, but it is NOT the layout the product ships - a stick
# written by scripts/flash_usb.sh has a GPT with the data volume as partition 2.
# The harness has to exercise the shipping layout, so the fixture carries a
# partition table too.
#
# genimage resolves each file entry's image= against --inputpath, which the
# harness points at the directory make_test_data.py wrote the fixture into.

image fixture-part.vfat {
	vfat {
		label = "PSBT_DATA"
		extraargs = "-F 32 -i 46495854"
		file test_unsigned.psbt { image = "test_unsigned.psbt" }
		file test_mnemonic.txt  { image = "test_mnemonic.txt" }
		# The negative fixture: a PSBT whose change output claims our
		# fingerprint over an address we do not control. S99signer hands it to
		# --expect-blocked, and the self-test fails unless it is refused. The
		# name does not end in .psbt so it is never listed as signable.
		file forged_change.psbt.bad { image = "forged_change.psbt.bad" }
	}
	size = 62M
}

image fixture.img {
	hdimage {
		partition-table-type = "gpt"
		disk-uuid = "5163ae70-5f11-4e05-9e05-0000000000fa"
	}

	partition data {
		image = "fixture-part.vfat"
		# Microsoft basic data, same type code the real data partition uses.
		partition-type-uuid = "ebd0a0a2-b9e5-4433-87c0-68b6b72699c7"
		partition-uuid = "5163ae70-5f11-4e05-9e05-0000000000fb"
		offset = 1M
	}
}
