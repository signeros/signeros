# /etc/signeros.conf - SignerOS runtime configuration
#
# Sourced by the init scripts and exported to the kiosk. Every value can be
# overridden from the kernel command line with signeros.<lowercase_name>=...,
# which is how the QEMU self-test switches network and enables headless mode
# without a separate rootfs. Command line wins over this file.
#
# This file lives on the read-only, RAM-resident root filesystem: it is part of
# the boot payload, not editable state.

# Bitcoin network: mainnet | testnet | signet | regtest
# Controls address encoding (bc1/tb1), BIP32 version bytes and the BIP44/49/84/86
# coin type used for the default derivation paths.
NETWORK=mainnet

# Filesystem label of the untrusted data partition (partition 2 of the USB
# stick) and where it gets mounted.
DATA_LABEL=PSBT_DATA
MOUNT_POINT=/mnt/data

# Explicit device override, e.g. sdb1. Empty means "find it by label", which is
# the normal case. Only useful when several volumes carry DATA_LABEL.
DATA_DEV=

# Seconds S01mount-data waits for USB enumeration before handing over to the
# background watcher. The GUI stays usable during the wait.
DATA_WAIT_SECS=8

# Qt platform abstraction: auto | linuxfb | eglfs
# auto picks eglfs when a DRM device and the eglfs plugin are both present,
# otherwise linuxfb on /dev/fb0. Both draw straight onto the KMS/DRM
# framebuffer; there is no X11 or Wayland on the image to fall back to.
QPA=auto

# Where Qt looks for fonts (no fontconfig on the image).
FONT_DIR=/usr/share/fonts/dejavu

# Also write a fully-signed, network-ready raw transaction (signed_<ts>.tx)
# next to the PSBT when every input finalises. Off by default: a signer's job
# ends at the PSBT, and the coordinator should do the broadcasting.
WRITE_FINAL_TX=0

# There is deliberately no derivation-path setting here.
#
# BIP174 PSBTs carry PSBT_IN_BIP32_DERIVATION for every input: the master
# fingerprint and the full path, per public key. The signer derives from those,
# so it never needs to be told - or to ask the operator for - a derivation
# scheme. A knob here would only create the impression that the path comes from
# configuration rather than from the transaction being signed.
