# /etc/mdev.conf - SignerOS device node ownership
#
# Applied once at boot by `mdev -s` (S00early). devtmpfs has already created
# the nodes; this file decides who may touch them.
#
# The kiosk account is in no supplementary group at all. Instead the four
# classes of node it genuinely needs are handed to group `signer` here. The
# authority is therefore enumerated in one file you can read in ten seconds,
# rather than implied by group membership.
#
# <device regex>	<uid>:<gid>	<octal perms>

# --- baseline character devices ---------------------------------------------
null			root:root	0666
zero			root:root	0666
full			root:root	0666
random			root:root	0444
urandom			root:root	0444
console			root:root	0622
tty			root:root	0666
ptmx			root:root	0666
kmsg			root:root	0600

# --- the panel -------------------------------------------------------------
# tty0 is the active VT: Qt's linuxfb/eglfs backends open it to switch the
# console into KD_GRAPHICS mode, which is what stops the framebuffer console
# drawing over the transaction you are reviewing.
#
# 0660, not 0620. Qt opens the VT O_RDWR (QFbVtHandler::setTTYCursor tries
# /dev/tty0, then /dev/tty, then /dev/console, and gives up silently on the
# first that it cannot open read-write). Mode 0620 gives the group write only,
# so every one of those three opens failed and the console kept its cursor and
# its blanking timer over the GUI.
tty0			root:signer	0660
tty1			root:signer	0660
tty[2-9]		root:root	0600
fb[0-9]			root:signer	0660
dri/card[0-9]		root:signer	0660
dri/renderD[0-9]*	root:signer	0660

# --- input ------------------------------------------------------------------
input/event[0-9]*	root:signer	0640
input/mice		root:signer	0640
input/mouse[0-9]*	root:signer	0640

# --- storage ----------------------------------------------------------------
# Root only. The kiosk never opens a block device: it reads and writes files
# through the mount that S01mount-data set up with noexec,nodev,nosuid.
sd[a-z]			root:root	0600
sd[a-z][0-9]*		root:root	0600

# --- everything else --------------------------------------------------------
rtc[0-9]		root:root	0640
hwrng			root:root	0600
.*			root:root	0600
