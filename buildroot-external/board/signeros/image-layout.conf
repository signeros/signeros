# SignerOS on-disk layout, single source of truth.
#
# Sourced by board/signeros/post-image.sh, scripts/test_in_qemu.sh and
# scripts/flash_usb.sh, and mirrored by genimage.cfg / genimage-test.cfg.
# Keep the four *_OFFSET/_SIZE values in sync with the genimage configs; the
# harness cross-checks them against the real GPT it finds in the image.

# Partition 1 - ESP: read-only FAT32 holding exactly one file,
# EFI/BOOT/bootx64.efi, which is the unified kernel image - kernel, initramfs
# and command line in a single (optionally Secure Boot signed) PE binary. There
# is no bootloader and no bootloader configuration. 256 MiB leaves room for a
# second UKI when you want an A/B update scheme.
SIGNEROS_ESP_LABEL="SIGNEROS"
SIGNEROS_ESP_OFFSET_MIB=1
SIGNEROS_ESP_SIZE_MIB=256

# Partition 2 - data: the only writable filesystem on the device. FAT32 so it
# can be read by every host OS without extra drivers. Mounted at /mnt/data
# with rw,noexec,nodev,nosuid,sync.
SIGNEROS_DATA_LABEL="PSBT_DATA"
SIGNEROS_DATA_OFFSET_MIB=257
SIGNEROS_DATA_SIZE_MIB=128

# The test image intentionally does NOT claim the data label, so that the
# 64 MiB fixture stick created by test_in_qemu.sh is the single unambiguous
# PSBT_DATA candidate in the VM.
SIGNEROS_TEST_DATA_LABEL="PSBT_SPARE"
