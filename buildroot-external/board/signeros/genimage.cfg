# SignerOS production image: GPT, two partitions, nothing else.
#
# Fixed UUIDs are deliberate: together with BR2_REPRODUCIBLE=y and
# SOURCE_DATE_EPOCH they make signeros.img byte-identical across rebuilds, so
# two people can independently confirm they produced the same signer.
#
# Offsets/sizes must match board/signeros/image-layout.conf.

# The ESP holds exactly one file: EFI/BOOT/bootx64.efi, which is the unified
# kernel image (kernel + initramfs + command line in a single signed PE binary).
# There is no bootloader, no bootloader configuration, and no separate kernel or
# initramfs file - nothing on this partition that boot depends on is outside the
# signature. 256 MiB leaves room for a second UKI when you want an A/B scheme.
image efi-part.vfat {
	vfat {
		label = "SIGNEROS"
		extraargs = "-F 32 -i 51634E45"
		file EFI { image = "efi-part/EFI" }
	}
	size = 256M
}

# The user drops unsigned.psbt here from their online machine; SignerOS writes
# signed_<timestamp>.psbt back next to it.
#
# The README is not filler. genimage cannot build a vfat image with no content -
# it runs `mcopy <tmp>/root/*` and the glob matches nothing - and a stick that
# explains itself when plugged into the online machine is better than a stick
# that looks empty and broken.
image data-part.vfat {
	vfat {
		label = "PSBT_DATA"
		extraargs = "-F 32 -i 50534254"
		file README.txt { image = "data-readme.txt" }
	}
	size = 128M
}

image signeros.img {
	hdimage {
		partition-table-type = "gpt"
		disk-uuid = "5163ae70-5f11-4e05-9e05-000000000001"
	}

	partition boot {
		image = "efi-part.vfat"
		partition-type-uuid = "U"
		partition-uuid = "5163ae70-5f11-4e05-9e05-000000000002"
		offset = 1M
		bootable = true
	}

	partition data {
		image = "data-part.vfat"
		# EBD0A0A2-... = Microsoft basic data, i.e. a plain removable
		# FAT32 volume that any host OS will mount without prompting.
		partition-type-uuid = "ebd0a0a2-b9e5-4433-87c0-68b6b72699c7"
		partition-uuid = "5163ae70-5f11-4e05-9e05-000000000003"
		offset = 257M
	}
}
